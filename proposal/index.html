<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Be My Valentine?</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffd6e7, #fff);
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            padding: 20px;
        }

        html {
            height: -webkit-fill-available;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 350px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .pixel-scene {
            width: 240px;
            height: 240px;
            position: relative;
            margin: 10px auto;
            animation: float 3s infinite ease-in-out;
        }

        .pixel-art {
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            gap: 0;
            width: 100%;
            height: 100%;
        }

        .pixel {
            width: 7.5px;
            height: 7.5px;
            transition: background-color 0.3s;
        }

        .tail {
            animation: wag 0.5s infinite;
            transform-origin: top center;
            -webkit-animation: wag 0.5s infinite;
        }

        .question {
            font-size: 1.8em;
            color: #ff69b4;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: fadeIn 2s forwards;
            -webkit-animation: fadeIn 2s forwards;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
        }

        button {
            font-size: 1.3em;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            -webkit-appearance: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff69b4, #ff8da1);
        }

        #noBtn {
            background: linear-gradient(45deg, #ff6961, #ff4757);
        }

        .heart {
            position: fixed;
            pointer-events: none;
            animation: floatUp 2s forwards;
            z-index: 2;
            -webkit-animation: floatUp 2s forwards;
        }

        .tear {
            position: fixed;
            background: linear-gradient(180deg, #89CFF0, #B0E0E6);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: fall 2s linear infinite;
            -webkit-animation: fall 2s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @-webkit-keyframes float {
            0% { -webkit-transform: translateY(0px) rotate(0deg); }
            50% { -webkit-transform: translateY(-10px) rotate(2deg); }
            100% { -webkit-transform: translateY(0px) rotate(0deg); }
        }

        @keyframes wag {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            100% { transform: rotate(-10deg); }
        }

        @-webkit-keyframes wag {
            0% { -webkit-transform: rotate(-10deg); }
            50% { -webkit-transform: rotate(10deg); }
            100% { -webkit-transform: rotate(-10deg); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        @-webkit-keyframes floatUp {
            0% { -webkit-transform: translateY(0); opacity: 1; }
            100% { -webkit-transform: translateY(-100px); opacity: 0; }
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        @-webkit-keyframes fall {
            to { -webkit-transform: translateY(100vh); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @-webkit-keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 1s infinite;
            -webkit-animation: sparkle 1s infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
        }

        @-webkit-keyframes sparkle {
            0%, 100% { -webkit-transform: scale(0); opacity: 0; }
            50% { -webkit-transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pixel-scene">
            <div id="pixelArtContainer" class="pixel-art"></div>
        </div>
        <div class="question">Will you be my Valentine? 💝</div>
        <div class="buttons">
            <button id="yesBtn">Yes! 💖</button>
            <button id="noBtn">No 😢</button>
        </div>
    </div>

    <script>
        // JavaScript from previous version with these changes:
        const colors = {
            body: '#FF69B4',  // Pink for Valentine's theme
            ears: '#FF1493',
            nose: '#1A1A1A',
            heart: '#FF0000',
            eye: '#1A1A1A',
            tongue: '#FF69B4',
            collar: '#FF1493',
            highlight: '#FF8DA1'
        };

        // Rest of the JavaScript remains the same
        function createLovingDogPattern() {
            const pattern = Array(32).fill().map(() => Array(32).fill('0'));
            
            // Body
            for(let i = 8; i < 24; i++) {
                for(let j = 8; j < 24; j++) {
                    pattern[i][j] = 'body';
                }
            }
            
            // Heart-shaped ears
            for(let i = 6; i < 10; i++) {
                for(let j = 8; j < 12; j++) {
                    pattern[i][j] = 'ears';
                }
                for(let j = 20; j < 24; j++) {
                    pattern[i][j] = 'ears';
                }
            }
            
            // Heart eyes
            const eyePositions = [
                [12,11], [12,13], [12,19], [12,21],
                [13,12], [13,20]
            ];
            eyePositions.forEach(([i,j]) => pattern[i][j] = 'heart');
            
            // Nose
            pattern[14][16] = 'nose';
            
            // Smiling mouth
            pattern[15][14] = 'tongue';
            pattern[15][18] = 'tongue';
            pattern[16][15] = 'tongue';
            pattern[16][16] = 'tongue';
            pattern[16][17] = 'tongue';
            
            // Heart accessory
            const heartPositions = [
                [10,14], [10,18],
                [11,13], [11,15], [11,17], [11,19],
                [12,14], [12,16], [12,18]
            ];
            heartPositions.forEach(([i,j]) => pattern[i][j] = 'heart');
            
            return pattern;
        }

        function createPlayfulDogPattern() {
            const pattern = Array(32).fill().map(() => Array(32).fill('0'));
            
            // Similar to previous but with Valentine's colors
            // Body
            for(let i = 8; i < 24; i++) {
                for(let j = 8; j < 24; j++) {
                    pattern[i][j] = 'body';
                }
            }
            
            // Ears
            for(let i = 4; i < 8; i++) {
                for(let j = 8; j < 12; j++) {
                    pattern[i][j] = 'ears';
                }
                for(let j = 20; j < 24; j++) {
                    pattern[i][j] = 'ears';
                }
            }
            
            // Eyes
            pattern[11][12] = 'eye';
            pattern[11][20] = 'eye';
            pattern[12][12] = 'eye';
            pattern[12][20] = 'eye';
            
            // Nose
            pattern[14][16] = 'nose';
            
            // Happy mouth
            for(let j = 14; j < 19; j++) {
                pattern[15][j] = 'tongue';
            }
            
            // Tail
            for(let i = 20; i < 24; i++) {
                pattern[i][24] = 'body';
            }
            
            return pattern;
        }

        let currentDog = 0;
        const patterns = [createLovingDogPattern(), createPlayfulDogPattern()];

        function createPixelArt(pattern) {
            const container = document.getElementById('pixelArtContainer');
            container.innerHTML = '';
            
            pattern.forEach((row, i) => {
                row.forEach((pixel, j) => {
                    const div = document.createElement('div');
                    div.className = 'pixel';
                    if (pixel !== '0') {
                        div.style.backgroundColor = colors[pixel];
                        if (pixel === 'body' && (i + j) % 3 === 0) {
                            div.style.backgroundColor = colors.highlight;
                        }
                        if (pixel === 'body' && i >= 20 && j >= 24) {
                            div.classList.add('tail');
                        }
                    }
                    container.appendChild(div);
                });
            });
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        function createTear() {
            const tear = document.createElement('div');
            tear.className = 'tear';
            tear.style.left = Math.random() * window.innerWidth + 'px';
            document.body.appendChild(tear);
            setTimeout(() => tear.remove(), 2000);
        }

        // Initial creation
        createPixelArt(patterns[0]);

        // Switch dogs every 3 seconds
        setInterval(() => {
            currentDog = (currentDog + 1) % patterns.length;
            createPixelArt(patterns[currentDog]);
        }, 3000);

        document.getElementById('yesBtn').addEventListener('click', () => {
            document.body.style.background = 'linear-gradient(135deg, #ff69b4, #ff8da1)';
            setInterval(createHeart, 100);
            document.querySelector('.question').textContent = 'Yay! My Valentine! 💖';
        });

        document.getElementById('noBtn').addEventListener('click', () => {
            document.body.style.background = 'linear-gradient(135deg, #ffd6e7, #ffb6c1)';
            setInterval(createTear, 100);
            document.querySelector('.question').textContent = '*sad puppy eyes* 😢';
            
            const noBtn = document.getElementById('noBtn');
            noBtn.addEventListener('mouseover', () => {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'absolute';
                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';
            });
        });
    </script>
</body>
</html>
